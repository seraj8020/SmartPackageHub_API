# Optional overlay — mount a JSON secrets file into the API container.
# 1) cp src/.../appsettings.QA.Secrets.json.example src/.../appsettings.QA.Secrets.json
# 2) fill secrets
# 3) docker compose --env-file .env.qa -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Prefer .env overrides for most secrets; use this when you want a Secrets.json file on disk.

services:
  api:
    volumes:
      - ${API_SECRETS_FILE:-./src/Services/SmartPackageHub.HubManagement/HubManagement.Api/appsettings.QA.Secrets.json}:/app/appsettings.${ASPNETCORE_ENVIRONMENT:-QA}.Secrets.json:ro
