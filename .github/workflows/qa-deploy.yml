# QA CI for SmartPackageHub API — runs on Development.
# Build always runs. GCP deploy is opt-in via repo Variable ENABLE_GCP_DEPLOY=true
# (plus GCP_* secrets). See docs/deploy-gcp.md.
name: QA API

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]
  workflow_dispatch:

concurrency:
  group: qa-api-${{ github.ref }}
  cancel-in-progress: true

env:
  API_PROJECT: src/Services/SmartPackageHub.HubManagement/HubManagement.Api/HubManagement.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore/build the API csproj only — repo root has multiple .sln/.slnLaunch
      # files and a docker-compose.dcproj that breaks bare `dotnet restore`.
      - name: Restore
        run: dotnet restore "$API_PROJECT"

      - name: Build
        run: dotnet build "$API_PROJECT" --configuration Release --no-restore

      # Publish without --no-build so the CI runner always emits a full publish folder.
      - name: Publish
        run: dotnet publish "$API_PROJECT" --configuration Release -o publish
        env:
          # Ensures appsettings.QA.json is available; runtime still uses ASPNETCORE_ENVIRONMENT on the VM.
          DOTNET_ENVIRONMENT: QA

      - name: Upload publish output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish
          retention-days: 7

  # Opt-in: set repo Variable ENABLE_GCP_DEPLOY=true when SSH secrets + VM are ready.
  deploy-gcp:
    name: Deploy to GCP QA (Docker Compose)
    needs: build
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/Development' &&
      vars.ENABLE_GCP_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          if [ -z "$GCP_VM_HOST" ] || [ -z "$GCP_VM_USER" ] || [ -z "$GCP_SSH_KEY" ]; then
            echo "::error::ENABLE_GCP_DEPLOY=true but GCP_VM_HOST / GCP_VM_USER / GCP_SSH_KEY secrets are missing."
            exit 1
          fi
          # Catch common secret paste mistakes before SSH (do not print secret values).
          if [[ "$GCP_VM_HOST" == *://* ]] || [[ "$GCP_VM_HOST" == *" "* ]]; then
            echo "::error::GCP_VM_HOST must be a bare IP/hostname (no https://, no spaces)."
            exit 1
          fi
          if ! printf '%s' "$GCP_SSH_KEY" | tr -d '\r' | grep -qE 'BEGIN (OPENSSH |RSA )?PRIVATE KEY'; then
            echo "::error::GCP_SSH_KEY must be the private key PEM (-----BEGIN ... PRIVATE KEY-----), not the .pub file."
            exit 1
          fi
          echo "Deploy target: ${GCP_VM_USER}@${GCP_VM_HOST}"

      # Native ssh so connection/auth errors are visible; strip CRLF from Windows-pasted keys.
      - name: Docker Compose up on GCE VM
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          SPH_API_DIR: ${{ vars.SPH_API_DIR }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$GCP_SSH_KEY" | tr -d '\r' > ~/.ssh/gcp_deploy
          chmod 600 ~/.ssh/gcp_deploy
          echo "TCP check ${GCP_VM_HOST}:22 ..."
          if ! timeout 15 bash -c "echo >/dev/tcp/${GCP_VM_HOST}/22"; then
            echo "::error::Cannot reach ${GCP_VM_HOST}:22 from GitHub Actions. Open VPC firewall tcp:22 (or confirm the VM external IP)."
            exit 1
          fi
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH auth check as ${GCP_VM_USER}@${GCP_VM_HOST} ..."
          if ! ssh -i ~/.ssh/gcp_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            "${GCP_VM_USER}@${GCP_VM_HOST}" 'echo ssh-ok'; then
            echo "::error::SSH auth failed for ${GCP_VM_USER}@${GCP_VM_HOST}. Re-check GCP_SSH_KEY (private key) and that its .pub is in GCE metadata / authorized_keys for that exact username."
            ssh -vvv -i ~/.ssh/gcp_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${GCP_VM_USER}@${GCP_VM_HOST}" 'true' || true
            exit 1
          fi
          DIR="${SPH_API_DIR:-/opt/sph/SmartPackageHub_API}"
          ssh -i ~/.ssh/gcp_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            "${GCP_VM_USER}@${GCP_VM_HOST}" \
            "DIR=$(printf %q "$DIR") bash -s" <<'REMOTE'
          set -euo pipefail
          if [ ! -d "$DIR" ]; then
            echo "Missing API clone at $DIR — clone the repo once, copy .env.qa.example → .env.qa, then re-run."
            exit 1
          fi
          if [ ! -f "$DIR/.env.qa" ]; then
            echo "Missing $DIR/.env.qa — copy from .env.qa.example and set real passwords."
            exit 1
          fi
          cd "$DIR"
          git fetch origin
          git checkout Development
          git pull --ff-only origin Development
          docker compose --env-file .env.qa up -d --build
          docker compose --env-file .env.qa ps
          set -a
          # shellcheck disable=SC1091
          source .env.qa
          set +a
          PORT="${API_HOST_PORT:-5000}"
          echo "Waiting for http://127.0.0.1:${PORT}/healthz ..."
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz"; then
              echo
              echo "healthz OK"
              exit 0
            fi
            echo "attempt $i/30 — not ready yet"
            sleep 5
          done
          echo "healthz failed; recent api logs:"
          docker compose --env-file .env.qa logs --tail=80 api || true
          exit 1
          REMOTE
